# .github/workflows/gitcompare.yml
name: GitCompare

on:
  workflow_dispatch:
    inputs:
      good_build:
        description: '"Good" build string (entire java -version + OpenJ9/OMR/JCL lines)'
        required: true
        type: string
      bad_build:
        description: '"Bad" build string (same format as good_build)'
        required: true
        type: string

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      GOOD_BUILD: ${{ github.event.inputs.good_build }}
      BAD_BUILD:  ${{ github.event.inputs.bad_build }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make parsing script executable
        run: chmod +x .github/scripts/commit_hunter.sh

      - name: Run commit_hunter.sh to produce compare URLs
        run: |
          .github/scripts/commit_hunter.sh "$GOOD_BUILD" "$BAD_BUILD"
